<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Folha de Renda - Início</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; }

        .navbar {
            background-color: #0a0a0a; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            height: 70px;
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(90deg, #4CAF50, #FFC107) 1;
        }
        .nav-logo { color: #4CAF50; font-size: 24px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 8px rgba(76, 175, 80, 0.3); }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 17px; font-weight: 300; transition: color 0.3s; }
        .nav-links a:hover { color: #fff; }
        .nav-profile { color: #ccc; font-size: 24px; cursor: pointer; }

        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 70px);
            text-align: center;
            padding: 20px;
        }
        .hero h1 {
            color: #fff;
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: 400;
        }
        .hero p {
            color: #aaa;
            font-size: 18px;
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .botoes-container {
            display: flex;
            gap: 20px;
        }
        .btn {
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
        }
        .btn:hover { transform: translateY(-2px); }
        
        .btn-green { background-color: #4CAF50; color: white; }
        .btn-green:hover { background-color: #388E3C; box-shadow: 0 0 8px rgba(76, 175, 80, 0.4); }
        
        .btn-yellow { background-color: #FFC107; color: #121212; }
        .btn-yellow:hover { background-color: #FFA000; box-shadow: 0 0 8px rgba(255, 193, 7, 0.4); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">Folha de Renda</div>
    </nav>

    <div class="hero">
        <h1>Bem-vindo ao Folha de Renda</h1>
        <p>Assuma o controle da sua vida financeira. Registre seus gastos, acompanhe sua renda mensal e defina metas de economia para o seu futuro de forma simples e rápida.</p>
        
        <div class="botoes-container">
            <a href="login.jsp" class="btn btn-green">Fazer Login</a>
            <a href="cadastro.jsp" class="btn btn-yellow">Criar Conta</a>
        </div>
    </div>

</body>
</html>
