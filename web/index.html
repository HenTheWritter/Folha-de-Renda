<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Folha de Renda</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .welcome-box { 
            background: #fff; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 400px; 
        }
        h1 { color: limegreen; margin-top: 0; }
        p { color: black; margin-bottom: 30px; line-height: 1.5; }
        .btn { 
            background-color: limegreen; 
            color: white; 
            padding: 12px 24px; 
            text-decoration: none; 
            border-radius: 4px; 
            font-size: 16px; 
            font-weight: bold; 
            transition: background 0.3s; 
        }
        .btn:hover { background-color: #02669c; }
    </style>
</head>
<body>
    <div class="welcome-box">
        <h1>Folha de Renda</h1>
        <p>Controle sua renda mensal, registre seus gastos e alcance suas metas de economia com facilidade.</p>
        
        <a href="login.jsp" class="btn">Acessar minha conta</a>
    </div>
</body>
</html>
